import {
  Globe,
  ChevronDown,

// --- SCROLL TO TOP BUTTON COMPONENT ---
function ScrollToTopButton() {
  const [show, setShow] = useState(false);
  const [isNearBottom, setIsNearBottom] = useState(false);

  useEffect(() => {
    const handleScroll = () => {
      if (window.scrollY > 300) {
        setShow(true);
      } else {
        setShow(false);
      }
      const totalHeight = document.documentElement.offsetHeight;
      const windowHeight = window.innerHeight;
      const scrolledHeight = window.scrollY;
      if (totalHeight - (windowHeight + scrolledHeight) < 150) {
        setIsNearBottom(true);
      } else {
        setIsNearBottom(false);
      }
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    handleScroll();
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  return (
    <button
      onClick={scrollToTop}
      className={`fixed right-6 md:right-10 z-[120] w-12 h-12 md:w-14 md:h-14 bg-white/70 backdrop-blur-md text-[#831a34] rounded-full shadow-[0_4px_24px_rgba(131,26,52,0.12)] border border-[#ddbfc2]/50 flex items-center justify-center group overflow-hidden focus:outline-none focus:ring-2 focus:ring-[#831a34]/30 cursor-pointer transition-all duration-500 ease-out ${
        show ? "opacity-100 translate-y-0 pointer-events-auto" : "opacity-0 translate-y-4 pointer-events-none"
      }`}
      style={{ bottom: isNearBottom ? "80px" : "32px" }}
      aria-label="トップに戻る"
    >
      <div className="absolute inset-0 bg-[#831a34] opacity-0 group-hover:opacity-100 transition-opacity duration-500 ease-out z-0" />
      <ChevronUp
        strokeWidth={1.5}
        className="w-5 h-5 md:w-6 md:h-6 relative z-10 text-[#831a34] group-hover:text-white transition-all duration-500 ease-out group-hover:-translate-y-1"
      />
    </button>
  );
}

// --- BOOKING MODAL COMPONENT ---
function BookingModal({ isOpen, onClose, lang }: { isOpen: boolean, onClose: () => void, lang: string }) {
  const [shouldRender, setShouldRender] = useState(isOpen);
  const [isAnimating, setIsAnimating] = useState(false);
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [selectedDate, setSelectedDate] = useState<any>(null);
  const [selectedTime, setSelectedTime] = useState<string | null>(null);
  const [weekOffset, setWeekOffset] = useState(0);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [isSuccess, setIsSuccess] = useState(false);

  const dateScrollRef = useRef<HTMLDivElement>(null);
  const [scrollProgress, setScrollProgress] = useState(0);

  const t = translations[lang]?.modal || translations["ja"].modal;

  const TIME_SLOTS = ["09:00", "10:00", "11:00", "12:00", "13:00", "15:00", "17:00", "19:00"];

  const handleDateScroll = (e: React.UIEvent<HTMLDivElement>) => {
    const { scrollLeft, scrollWidth, clientWidth } = e.currentTarget;
    const maxScroll = scrollWidth - clientWidth;
    if (maxScroll > 0) {
      setScrollProgress(Math.min(1, Math.max(0, scrollLeft / maxScroll)));
    }
  };

  // Reset scroll position on week offset change (Q2: A)
  useEffect(() => {
    if (dateScrollRef.current) {
      dateScrollRef.current.scrollLeft = 0;
      setScrollProgress(0);
    }
  }, [weekOffset]);

  // Generate 7 days starting from tomorrow (Q1: A, Q3: A)
  const dates = useMemo(() => {
    const list = [];
    const now = new Date();
    const baseDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1 + weekOffset * 7);

    const weekdayMap: Record<string, string[]> = {
      ja: ["日", "月", "火", "水", "木", "金", "土"],
      en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      zh: ["日", "一", "二", "三", "四", "五", "六"],
      ko: ["일", "월", "화", "수", "목", "금", "토"],
      fr: ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"],
      es: ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      th: ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"],
      vi: ["CN", "T2", "T3", "T4", "T5", "T6", "T7"]
    };
    const dayLabels = weekdayMap[lang] || weekdayMap["ja"];

    for (let i = 0; i < 7; i++) {
      const cur = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + i);
      const m = cur.getMonth() + 1;
      const d = cur.getDate();
      const dayIdx = cur.getDay();
      const key = `${cur.getFullYear()}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      list.push({
        dateKey: key,
        year: cur.getFullYear(),
        month: m,
        day: d,
        dayOfWeekIndex: dayIdx,
        dayName: dayLabels[dayIdx]
      });
    }
    return list;
  }, [weekOffset, lang]);

  // Fixed booked slot logic (Q5: B)
  const isSlotBooked = (dateItem: any, time: string) => {
    if (!dateItem) return false;
    // Saturday: 15:00 is fixed booked
    if (dateItem.dayOfWeekIndex === 6 && time === "15:00") return true;
    // Sunday: 10:00 is fixed booked
    if (dateItem.dayOfWeekIndex === 0 && time === "10:00") return true;
    // Weekdays: even day -> 11:00 booked, odd day -> 17:00 booked
    if (dateItem.dayOfWeekIndex >= 1 && dateItem.dayOfWeekIndex <= 5) {
      if (dateItem.day % 2 === 0 && time === "11:00") return true;
      if (dateItem.day % 2 !== 0 && time === "17:00") return true;
    }
    return false;
  };

  const handleSelectDate = (item: any) => {
    setSelectedDate(item);
    // If the currently selected time is booked on this date, clear time selection
    if (selectedTime && isSlotBooked(item, selectedTime)) {
      setSelectedTime(null);
    }
  };

  const handleSelectTime = (time: string) => {
    if (!selectedDate || isSlotBooked(selectedDate, time)) return;
    setSelectedTime(time);
  };

  useEffect(() => {
    let frame1: number;
    let frame2: number;
    let timer: any;

    if (isOpen) {
      setShouldRender(true);
      document.body.style.overflow = "hidden";
      frame1 = requestAnimationFrame(() => {
        frame2 = requestAnimationFrame(() => {
          setIsAnimating(true);
        });
      });
    } else {
      setIsAnimating(false);
      timer = setTimeout(() => {
        setShouldRender(false);
        document.body.style.overflow = "";
      }, 500);
    }

    return () => {
      if (frame1) cancelAnimationFrame(frame1);
      if (frame2) cancelAnimationFrame(frame2);
      if (timer) clearTimeout(timer);
    };
  }, [isOpen]);

  useEffect(() => {
    return () => { document.body.style.overflow = ""; };
  }, []);

  const isFormValid = Boolean(name.trim() && email.trim() && selectedDate && selectedTime);

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!isFormValid) return;

    setIsSubmitting(true);
    setTimeout(() => {
      setIsSubmitting(false);
      setIsSuccess(true);
    }, 1500);
  };

  const handleCloseAll = () => {
    onClose();
    setTimeout(() => {
      setIsSuccess(false);
      setName("");
      setEmail("");
      setSelectedDate(null);
      setSelectedTime(null);
      setWeekOffset(0);
      setScrollProgress(0);
      if (dateScrollRef.current) {
        dateScrollRef.current.scrollLeft = 0;
      }
    }, 500);
  };

  if (!shouldRender) return null;

  return (
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 sm:p-4">
      <div 
        onClick={handleCloseAll} 
        className={`absolute inset-0 bg-stone-950/60 backdrop-blur-md transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${isAnimating ? 'opacity-100' : 'opacity-0 backdrop-blur-none'}`} 
      />
      <div 
        className={`relative w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden border border-[#ddbfc2]/30 z-[210] max-h-[92vh] flex flex-col transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${isAnimating ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-95 translate-y-2'}`} 
        role="dialog" 
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-describedby="modal-desc"
      >
        <div className="bg-[#831a34] px-5 sm:px-6 py-4 flex justify-between items-center text-white shrink-0">
          <div className="flex items-center space-x-2">
            <CalendarDays className="w-5 h-5 text-[#eedbde]" />
            <h2 id="modal-title" className="font-heading font-semibold tracking-wider text-sm sm:text-base m-0">{t.title}</h2>
          </div>
          <button aria-label="閉じる" onClick={handleCloseAll} className="text-white/80 hover:text-white hover:bg-white/10 p-1.5 rounded-full transition-colors focus:outline-none cursor-pointer">
            <X className="w-5 h-5" />
          </button>
        </div>
        <div className="p-5 sm:p-7 overflow-y-auto flex-grow overscroll-contain" style={{ WebkitOverflowScrolling: "touch" }}>
          {isSuccess ? (
            <div className="py-6 px-4 flex flex-col items-center text-center space-y-5">
              <div className="relative">
                <div className="absolute inset-0 bg-[#eedbde]/50 rounded-full blur-xl scale-125" />
                <Check className="w-16 h-16 text-[#831a34] relative bg-[#eedbde]/40 p-3 rounded-full" />
              </div>
              <h3 className="font-heading text-xl md:text-2xl font-bold text-[#4A0E0E]">{t.successTitle}</h3>
              <div className="max-w-xs space-y-2">
                <p className="font-body text-sm text-[#4A0E0E] font-medium">{t.successThankYou.replace("{name}", name)}</p>
                {selectedDate && selectedTime && (
                  <div className="bg-[#eedbde]/25 border border-[#ddbfc2]/60 rounded-xl py-2.5 px-3 text-xs text-[#4A0E0E] font-body flex items-center justify-center gap-2 mt-2">
                    <CalendarDays className="w-4 h-4 text-[#831a34] shrink-0" />
                    <span className="font-semibold">{selectedDate.month}/{selectedDate.day}({selectedDate.dayName}) {selectedTime}</span>
                  </div>
                )}
                <p className="font-body text-xs text-stone-500 leading-relaxed pt-1">{t.successBody.replace("{email}", email)}</p>
              </div>
              <button onClick={handleCloseAll} className="mt-4 px-10 py-3 bg-[#831a34] text-white rounded-full font-semibold text-sm hover:opacity-95 transition-opacity shadow-md cursor-pointer">
                {t.successBtnClose}
              </button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="space-y-5">
              <div className="text-center pb-3 border-b border-[#ddbfc2]/20">
                <p id="modal-desc" className="font-body text-xs sm:text-sm text-[#695b5e] leading-relaxed">{t.desc}</p>
                <p className="font-body text-[11px] sm:text-xs text-[#831a34] font-semibold leading-relaxed mt-2">{t.demoNotice || "※ポートフォリオ用デモのため、実際の日時予約やメール送信は行われません。"}</p>
              </div>

              {/* 1. お名前 */}
              <div>
                <label htmlFor="modal-name" className="block text-xs uppercase font-semibold text-[#4A0E0E] tracking-wider mb-1.5 font-body">
                  {t.nameLabel} <span className="text-[#831a34] font-bold">*</span>
                </label>
                <input id="modal-name" type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder={t.namePlaceholder} className="w-full px-4 py-2.5 border border-[#ddbfc2]/40 rounded-xl focus:border-[#831a34] focus:ring-1 focus:ring-[#831a34] outline-none transition-colors text-sm sm:text-base font-body bg-stone-50" />
              </div>

              {/* 2. メールアドレス */}
              <div>
                <label htmlFor="modal-email" className="block text-xs uppercase font-semibold text-[#4A0E0E] tracking-wider mb-1.5 font-body">
                  {t.emailLabel} <span className="text-[#831a34] font-bold">*</span>
                </label>
                <input id="modal-email" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t.emailPlaceholder} className="w-full px-4 py-2.5 border border-[#ddbfc2]/40 rounded-xl focus:border-[#831a34] focus:ring-1 focus:ring-[#831a34] outline-none transition-colors text-sm sm:text-base font-body bg-stone-50" />
              </div>

              {/* 3. ご希望の日程 */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs uppercase font-semibold text-[#4A0E0E] tracking-wider font-body">
                    {t.dateLabel || "ご希望の日程"} <span className="text-[#831a34] font-bold">*</span>
                  </label>
                  <div className="flex items-center space-x-1">
                    <span className="text-[11px] font-medium text-[#695b5e] font-body mr-1">
                      {dates[0]?.month}月
                    </span>
                    <button
                      type="button"
                      aria-label="前の7日"
                      onClick={() => setWeekOffset(w => Math.max(0, w - 1))}
                      disabled={weekOffset === 0}
                      className="p-1 rounded-lg border border-[#ddbfc2]/50 text-stone-600 hover:bg-stone-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
                    >
                      <ChevronLeft className="w-3.5 h-3.5" />
                    </button>
                    <button
                      type="button"
                      aria-label="次の7日"
                      onClick={() => setWeekOffset(w => Math.min(3, w + 1))}
                      disabled={weekOffset >= 3}
                      className="p-1 rounded-lg border border-[#ddbfc2]/50 text-stone-600 hover:bg-stone-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
                    >
                      <ChevronRight className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {/* 週間スクロール日付カード (Q1, Q2, Q3) */}
                <div
                  ref={dateScrollRef}
                  onScroll={handleDateScroll}
                  className="flex gap-1.5 sm:gap-2 overflow-x-auto pb-1 pt-0.5 no-scrollbar snap-x"

              {/* 5. 無料体験の内容 (維持) */}
              <div>

                <div className="grid grid-cols-1 gap-3">
                  <div className="border border-[#831a34] bg-[#eedbde]/15 shadow-sm rounded-xl p-3.5 flex flex-col justify-between">
                    <div className="flex items-center mb-1.5">
                      <span className="text-[10px] font-bold text-[#831a34] bg-[#eedbde] px-2 py-0.5 rounded-full">{t.timeCounseling}</span>
                    </div>
                    <span className="font-heading text-sm font-semibold text-[#4A0E0E]">{t.counselingTitle}</span>
                    <p className="font-body text-[10px] text-stone-500 mt-1 leading-normal">{t.counselingDesc}</p>
                  </div>
                </div>
              </div>

              {/* 補助テキスト (Q6: A) */}
              {!isFormValid && (
                <p className="text-[11px] text-stone-400 text-center font-body pt-1">
                  {t.selectDateTimeHelp || "※お名前、メール、ご希望の日時を選択すると完了できます"}
                </p>
              )}

              {/* 6. キャンセル / デモ操作を完了する */}
              <div className="pt-1 flex flex-col sm:flex-row gap-3">
                <button type="button" onClick={handleCloseAll} className="w-full sm:w-1/3 py-3 border border-[#ddbfc2] text-stone-600 rounded-full font-medium text-sm hover:bg-stone-50 transition-colors focus:outline-none focus:ring-2 focus:ring-[#eedbde] cursor-pointer">{t.btnCancel}</button>
                <button 
                  type="submit" 
                  disabled={!isFormValid || isSubmitting} 
                  className="w-full sm:w-2/3 py-3 bg-[#831a34] text-white rounded-full font-semibold text-sm hover:opacity-95 transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center space-x-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:shadow-none cursor-pointer"
                >
                  {isSubmitting ? (
                    <>
                      <Loader2 className="w-4 h-4 animate-spin" />
                      <span>{t.btnSubmitting}</span>
                    </>
                  ) : (
                    <span>{t.btnSubmit}</span>
                  )}
                </button>
              </div>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

function parseReasonTitle(rawHtml: string, fallbackNum: string) {
  if (!rawHtml) return { num: fallbackNum, text: "" };
  const spanMatch = rawHtml.match(/^<span[^>]*>\s*(\d+\.?)(?:&nbsp;|\s)*<\/span>\s*(.*)/i);
  if (spanMatch) {
    return {
      num: spanMatch[1].endsWith('.') ? spanMatch[1] : `${spanMatch[1]}.`,
      text: spanMatch[2]
    };
  }
  const textMatch = rawHtml.match(/^(\d+\.?)\s*(.*)/);
  if (textMatch) {
    return {
      num: textMatch[1].endsWith('.') ? textMatch[1] : `${textMatch[1]}.`,
      text: textMatch[2]
    };
  }
  return { num: fallbackNum, text: rawHtml };
}

function App() {

  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [faqOpen, setFaqOpen] = useState<Record<number, boolean>>({});

  const langMenuRef = useRef<HTMLDivElement>(null);

  useEffect(() => {
    document.documentElement.setAttribute("lang", lang);
  }, [lang]);

  useEffect(() => {
    function handleClickOutside(event: MouseEvent) {
      if (langMenuRef.current && !langMenuRef.current.contains(event.target as Node)) {
        setIsLangMenuOpen(false);
      }
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => { document.removeEventListener("mousedown", handleClickOutside); };
  }, []);

  useEffect(() => {
    if (isMobileMenuOpen) {
      document.body.style.overflow = "hidden";
    } else {
      document.body.style.overflow = "";
    }
    return () => { document.body.style.overflow = ""; };
  }, [isMobileMenuOpen]);

  useEffect(() => {
    const reveals = document.querySelectorAll(".reveal, .reveal-left, .reveal-right");
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      },
      { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
    );

    reveals.forEach((reveal) => { observer.observe(reveal); });
    return () => { observer.disconnect(); };
  }, [lang]);

  const t = translations[lang] || translations["ja"];

  const r1Parsed = parseReasonTitle(t.reasons?.r1Title, "1.");
  const r2Parsed = parseReasonTitle(t.reasons?.r2Title, "2.");
  const r3Parsed = parseReasonTitle(t.reasons?.r3Title, "3.");

  const toggleFaq = (id: number) => {
    setFaqOpen((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const currentLangName = languages.find((l) => l.code === lang)?.name || "日本語";

  const easeInOutCubic = (time: number) => {
    return time < 0.5 ? 4 * time * time * time : 1 - Math.pow(-2 * time + 2, 3) / 2;
  };

  const handleSmoothScroll = (e: React.MouseEvent, targetId: string) => {
    e.preventDefault();
    setIsMobileMenuOpen(false);

    if (targetId === '#') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    const target = document.getElementById(targetId.substring(1));
    if (!target) return;

    const header = document.getElementById('main-nav');
    const headerHeight = header ? header.offsetHeight : 80;

    const targetPosition = target.getBoundingClientRect().top + window.scrollY - headerHeight;
    const startPosition = window.scrollY;
    const distance = targetPosition - startPosition;
    
    const absDistance = Math.abs(distance);
    let duration = 800; 
    if (absDistance < 500) {
      duration = 600 + (absDistance / 500) * 100;
    } else if (absDistance < 1500) {
      duration = 800 + ((absDistance - 500) / 1000) * 100;
    } else {
      duration = Math.min(1200, 900 + ((absDistance - 1500) / 2000) * 300);
    }

    let startTime: number | null = null;

    const animation = (currentTime: number) => {
      if (startTime === null) startTime = currentTime;
      const timeElapsed = currentTime - startTime;
      const progress = Math.min(timeElapsed / duration, 1);
      
      const ease = easeInOutCubic(progress);
      window.scrollTo(0, startPosition + distance * ease);

      if (timeElapsed < duration) {
        requestAnimationFrame(animation);
      }
    };

    requestAnimationFrame(animation);
  };

  const faqs = [
    { id: 1, question: t.faq.q1, answer: t.faq.a1 },

                      <h3 className="font-heading text-[13px] sm:text-sm md:text-lg font-bold text-[#4A0E0E] pr-2 md:pr-0" dangerouslySetInnerHTML={{ __html: z.question }} />
                    </div>
                    <div className={`faq-icon-wrapper relative w-6 h-6 flex-shrink-0 transition-transform duration-[800ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${faqOpen[z.id] ? "rotate-45" : ""}`}>
                      <Plus className="absolute inset-0 text-[#630020] w-6 h-6" />
                    </div>
                  </button>
                  
                  <div className="faq-content">
                    <div className="faq-inner">
                      <div className="px-4 md:px-6 pb-6 pt-4 flex gap-3 md:gap-4 items-start border-t border-[#ddbfc2]/10 bg-rose-50/5">
                        <div className="w-8 h-8 rounded-full bg-rose-600 flex-shrink-0 flex items-center justify-center text-white font-bold font-heading">A</div>
                        <p className="font-body text-[14px] md:text-base text-[#333333] pt-1 leading-relaxed" dangerouslySetInnerHTML={{ __html: z.answer }} />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FINAL CTA SECTION */}
      <section className="py-16 md:py-24 bg-[#F0F3FF] relative overflow-hidden" id="contact">
        <div className="absolute inset-0 bg-[#831a34]/[0.05]" />
        <div className="max-w-[1200px] mx-auto px-6 text-center relative z-10 reveal">
          <h2 className="font-heading text-headline-xl-mobile md:text-headline-xl font-bold text-[#4A0E0E] mb-8 fluid-h1">
            {t.finalCta.headline}<span className="inline-block">{t.finalCta.headlineHighlight}</span>
          </h2>
          <p className="font-body text-lg text-[#333333] max-w-2xl mx-auto mb-12 fluid-body leading-relaxed md:leading-normal">
            <span className="block md:inline" dangerouslySetInnerHTML={{ __html: t.finalCta.body1 }} />
            <span className="block md:inline" dangerouslySetInnerHTML={{ __html: t.finalCta.body2 }} />
          </p>
          <button onClick={() => setIsModalOpen(true)} className="inline-flex items-center justify-center px-8 py-4 bg-[#831a34] text-white rounded-full font-semibold hover:opacity-90 transition-opacity pulse-soft w-full md:w-auto text-sm cursor-pointer shadow-md font-body btn-shine">
            <span className="btn-shine-content">
              <CalendarDays className="mr-2 w-5 h-5" />
              {t.finalCta.cta}
            </span>
          </button>
        </div>
      </section>

      {/* ACCESS SECTION */}
      <section className="py-16 md:py-24 bg-white overflow-hidden" id="access">
        <div className="max-w-[1200px] mx-auto px-6">
          <div className="text-center mb-16 reveal">
            <span className="font-heading text-sm text-[#4A0E0E] mb-4 block uppercase font-bold tracking-wider">{t.access.badge}</span>
            <h2 className="font-heading font-bold text-[#4A0E0E] fluid-h2">{t.access.headline}</h2>
          </div>
          <div className={lang === "ja" ? "flex flex-col lg:grid lg:grid-cols-[2fr_3fr] gap-10 lg:gap-12 lg:items-center" : ""}>
            {lang === "ja" && (
              <div className="reveal text-center lg:text-left font-body text-[#333333] lg:pr-2">
                <h3 className="font-heading text-xl md:text-2xl font-bold text-[#4A0E0E] mb-5">Ebisu Private Gym</h3>
                <div className="space-y-2 text-sm md:text-base leading-relaxed">
                  <p>東京都渋谷区恵比寿1-XX-XX</p>
                  <p>恵比寿駅 徒歩5分</p>
                  <p>営業時間 9:00〜21:00</p>
                  <p>定休日 月曜日</p>
                </div>
                <p className="mt-5 text-xs text-[#777777] leading-relaxed">※店舗名・住所・店舗情報はポートフォリオ用の架空設定です。</p>
              </div>
            )}
            <div className="reveal overflow-hidden rounded-xl border border-[#ddbfc2] shadow-sm w-full">
              <iframe allowFullScreen height="450" loading="lazy" referrerPolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=%E6%81%B5%E6%AF%94%E5%AF%BF%E9%A7%85&output=embed" style={{ border: 0 }} width="100%" title="Y_Gym Ebisu Area Map" />
            </div>
          </div>
        </div>
      </section>
      </main>

      {/* FOOTER */}
      <footer className="w-full text-[#630020] py-16 bg-[#F0F3FF]">
        <div className="max-w-[1200px] mx-auto px-6 flex flex-col items-center">
          <div className="mb-12 text-center">
            <div className="text-2xl tracking-widest font-heading font-bold text-[#630020]">{t.footer.logo}</div>
          </div>

          {/* Footer Nav */}
          <div className="grid grid-cols-2 gap-x-12 gap-y-4 mb-16 text-center text-[#630020]/80 text-xs sm:text-sm font-body">
            <div><a href="#faq" onClick={(e) => handleSmoothScroll(e, '#faq')} className="hover:text-[#831a34] nav-link-hover">{t.footer.faq}</a></div>
            <div><a href="#contact" onClick={(e) => handleSmoothScroll(e, '#contact')} className="hover:text-[#831a34] nav-link-hover">{t.footer.contact}</a></div>
          </div>

          <div className="text-[10px] md:text-xs text-stone-500 font-body max-w-xl text-center mb-4 leading-relaxed px-4">
            <span dangerouslySetInnerHTML={{ __html: t.footer.disclaimer }} />
          </div>
          <div className="text-[11px] sm:text-xs opacity-60 font-body">{t.footer.copyright}</div>
        </div>
      </footer>

      {/* Scroll To Top */}
      <ScrollToTopButton />

      {/* Booking Modal */}
      <BookingModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} lang={lang} />
    </div>
  );
}


const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
